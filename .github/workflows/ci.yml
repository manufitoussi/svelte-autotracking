name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - run: yarn install --frozen-lockfile
    - run: yarn run check
    - run: yarn test
    - run: yarn build

  package:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        svelte-version: [3, 4]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: yarn
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - run: npm pack --pack-destination "$RUNNER_TEMP"
    - name: Install the package with Svelte ${{ matrix.svelte-version }}
      working-directory: ${{ runner.temp }}
      run: |
        npm init -y
        npm install ./svelte-autotracking-*.tgz svelte@${{ matrix.svelte-version }}
    - name: Smoke test
      working-directory: ${{ runner.temp }}
      run: node "$GITHUB_WORKSPACE/scripts/smoke-test.cjs"
